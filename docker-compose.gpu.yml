version: '3.8'

services:
  docling-ocr:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: docling-ocr:${VERSION:-latest}
    container_name: docling-ocr
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:8002"
    environment:
      # API Configuration
      - API_VERSION=${API_VERSION:-1.0.1}
      - API_TITLE=${API_TITLE:-Docling OCR API}
      - API_DESCRIPTION=${API_DESCRIPTION:-API for converting documents using Docling}
      - API_PREFIX=${API_PREFIX:-/ocr/docling}
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8002
      - WORKERS=${WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # File Upload Limits
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-104857600}
      - MAX_FILES_IN_ARCHIVE=${MAX_FILES_IN_ARCHIVE:-100}
      - TEMP_FILES_TTL=${TEMP_FILES_TTL:-3600}
      
      # Docling Configuration
      - DOCLING_PIPELINE_MODE=${DOCLING_PIPELINE_MODE:-standard}
      - DOCLING_ARTIFACTS_PATH=/app/models
      
      # OCR Configuration
      - DOCLING_OCR_ENABLED=${DOCLING_OCR_ENABLED:-true}
      - DOCLING_OCR_ENGINE=${DOCLING_OCR_ENGINE:-easyocr}
      - DOCLING_OCR_LANGUAGES=${DOCLING_OCR_LANGUAGES:-en,ru}
      - DOCLING_OCR_GPU=${DOCLING_OCR_GPU:-true}
      - DOCLING_OCR_FORCE_FULL_PAGE=${DOCLING_OCR_FORCE_FULL_PAGE:-false}
      
      # Table Processing
      - DOCLING_TABLE_MODE=${DOCLING_TABLE_MODE:-accurate}
      - DOCLING_TABLE_CELL_MATCHING=${DOCLING_TABLE_CELL_MATCHING:-true}
      
      # VLM Configuration
      - DOCLING_VLM_ENABLED=${DOCLING_VLM_ENABLED:-true}
      - DOCLING_VLM_API_URL=${DOCLING_VLM_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      - DOCLING_VLM_API_KEY=${DOCLING_VLM_API_KEY:-your-openrouter-api-key}
      - DOCLING_VLM_MODEL=${DOCLING_VLM_MODEL:-qwen/qwen3-vl-235b-a22b-instruct}
      - DOCLING_VLM_TIMEOUT=${DOCLING_VLM_TIMEOUT:-120}
      - DOCLING_VLM_TEMPERATURE=${DOCLING_VLM_TEMPERATURE:-0.0}
      - DOCLING_VLM_MAX_TOKENS=${DOCLING_VLM_MAX_TOKENS:-4096}
      - DOCLING_VLM_PROMPT=${DOCLING_VLM_PROMPT:-Convert this page to docling.}
      - DOCLING_VLM_RESPONSE_FORMAT=${DOCLING_VLM_RESPONSE_FORMAT:-markdown}
      
      # Archive Processing
      - PRESERVE_STRUCTURE=${PRESERVE_STRUCTURE:-true}
      - EXTRACT_TIMEOUT=${EXTRACT_TIMEOUT:-300}
      
      # Output Configuration
      - DEFAULT_OUTPUT_FORMAT=${DEFAULT_OUTPUT_FORMAT:-markdown}
      - ENABLE_CHUNKING=${ENABLE_CHUNKING:-false}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      
      # Advanced Features
      - ENABLE_TABLE_EXTRACTION=${ENABLE_TABLE_EXTRACTION:-true}
      - ENABLE_VISUAL_GROUNDING=${ENABLE_VISUAL_GROUNDING:-false}
      - ENABLE_METADATA_EXTRACTION=${ENABLE_METADATA_EXTRACTION:-true}
      
      # Directories
      - TEMP_DIR=/app/temp
    
    volumes:
      - ./temp:/app/temp
      - ./models:/app/models
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ocr/docling/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - docling-ocr-network

    # GPU Configuration for Docker Compose v1.28+
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  docling-ocr-network:
    driver: bridge
