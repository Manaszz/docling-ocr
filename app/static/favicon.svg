<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#4A90E2" opacity="0.1"/>
  
  <!-- Document icon -->
  <rect x="18" y="14" width="28" height="36" rx="2" fill="#4A90E2" stroke="#2E5C8A" stroke-width="1.5"/>
  
  <!-- Folded corner -->
  <path d="M 38 14 L 38 22 L 46 22 Z" fill="#2E5C8A"/>
  <path d="M 38 14 L 38 22 L 46 22" fill="none" stroke="#1A3A5A" stroke-width="1" stroke-linejoin="miter"/>
  
  <!-- Lines representing text -->
  <line x1="22" y1="28" x2="42" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="38" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- OCR/Scan effect (grid pattern) -->
  <circle cx="32" cy="20" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>
